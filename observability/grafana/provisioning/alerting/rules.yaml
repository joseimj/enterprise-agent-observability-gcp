apiVersion: 1
groups:
  - orgId: 1
    name: risk-workflow-alerts
    folder: Risk Agent
    interval: 1m
    rules:
      - uid: risk-workflow-errors
        title: Risk Workflow Errors
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Risk agent upstream error rate is above 10% over 5m
        labels:
          severity: warning
          team: platform
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              expr: sum(rate(risk_requests_total{outcome="error"}[5m])) / clamp_min(sum(rate(risk_requests_total[5m])), 0.000001)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {params: [0.1], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {type: last}
                  type: query
              refId: C
